<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select time — AccessPath Clinic</title><link rel="stylesheet" href="../styles.css"></head>
<body><main><p class="step">Step 2 of 4</p><h1>Select an appointment time</h1><p id="slot-instructions">Choose one available time, then continue.</p>
<p class="fixture-note fixture-note--accessible" data-testid="fixture-behavior">These time buttons are keyboard reachable and activate with Enter.</p>
<div class="slots" aria-describedby="slot-instructions">
  <button class="slot" type="button" data-testid="appointment-slot" data-slot-id="0900" aria-pressed="false">09:00 — Dr. Rao</button>
  <button class="slot" type="button" data-testid="appointment-slot" data-slot-id="1030" aria-pressed="false">10:30 — Dr. Rao</button>
  <button class="slot" type="button" data-testid="appointment-slot" data-slot-id="1400" aria-pressed="false">14:00 — Dr. Rao</button>
</div>
<p id="selection-status" role="status" aria-live="polite"></p>
<div class="actions"><a href="service.html">Back</a><button id="continue" type="button" data-testid="continue" disabled>Continue</button></div>
</main><script src="../slot-selection.js"></script></body></html>
