<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter — AccessPath benchmark</title><link rel="stylesheet" href="../styles.css"></head>
<body><main><h1>Join the newsletter</h1>
<p class="fixture-note fixture-note--accessible">Reference page: every control is reachable, named and visibly focused.</p>
<label for="email">Email address</label> <input id="email" type="email" autocomplete="email">
<button id="subscribe" type="button">Subscribe</button>
<p id="status" role="status"></p></main>
<script>document.getElementById('subscribe').addEventListener('click', () => {
  document.getElementById('status').textContent = 'Subscribed: ' + document.getElementById('email').value;
});</script></body></html>
