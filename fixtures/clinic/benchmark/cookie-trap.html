<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — AccessPath benchmark</title><link rel="stylesheet" href="../styles.css"></head>
<body><main><h1>Article</h1>
<p class="fixture-note fixture-note--blocked">Known barrier: the cookie search box keeps focus on Tab and Escape (WCAG 2.1.2).</p>
<div role="dialog" aria-label="Cookie choices" style="border:1px solid #cbd5e1;padding:1rem">
<label for="cookie-search">Search cookie types</label> <input id="cookie-search" type="search">
</div>
<p><a href="done.html">Continue to the article</a></p></main>
<script>const trap = document.getElementById('cookie-search');
trap.addEventListener('keydown', (event) => {
  if (event.key === 'Tab' || event.key === 'Escape') { event.preventDefault(); trap.focus(); }
});</script></body></html>
