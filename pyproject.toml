[project]
name = "accesspath-ai"
version = "0.1.0"
description = "Evidence-driven keyboard accessibility journey evaluation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "celery[redis]==5.6.3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "playwright>=1.55,<2",
  "google-genai>=1.0,<2",
  "cryptography>=44",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.12,<1",
  "pyright>=1.1.400,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report builders embed long prose paragraphs verbatim.
"scripts/build_*synopsis_report.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["engine"]
exclude = [".venv", ".runtime", "migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra"
