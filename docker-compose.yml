services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accesspath}
      POSTGRES_USER: ${POSTGRES_USER:-accesspath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores data in a major-version-specific subdirectory.
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accesspath} -d ${POSTGRES_DB:-accesspath}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fixture:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./fixtures/clinic:/usr/share/nginx/html:ro
      - ./infrastructure/fixture-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build:
      context: .
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/.venv
      - run_output:/app/output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: development
    command: celery -A config worker --loglevel=INFO --concurrency=1
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv
      - run_output:/app/output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_v18:
  run_output:
